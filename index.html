      function buildXTicks(trials) {
        const points = new Set([0, trials]);
        const roughStep = Math.max(1, Math.round(trials / 4));

        for (let x = roughStep; x < trials; x += roughStep) {
          points.add(x);
        }

        return Array.from(points).sort((a, b) => a - b);
      }

      function buildYTicks(minValue, maxValue) {
        const ticks = [];
        const segments = 4;
        const step = (maxValue - minValue) / segments;

        for (let i = 0; i <= segments; i += 1) {
          ticks.push(Number((minValue + step * i).toFixed(2)));
        }

        ticks.push(0);

        return Array.from(new Set(ticks))
          .sort((a, b) => a - b)
          .map((value) => Number(value.toFixed(2)));
      }

      function generateSimulations(params) {
        return Array.from({ length: 5 }, (_, index) => {
          let cumulative = 0;
          const points = [{ x: 0, y: 0 }];

          for (let trial = 1; trial <= params.trials; trial += 1) {
            const success = Math.random() < params.successRate / 100;
            cumulative += success ? params.gain : -params.loss;
            points.push({ x: trial, y: Number(cumulative.toFixed(2)) });
          }

          return {
            id: index + 1,
            points,
            final: Number(cumulative.toFixed(2)),
          };
        });

      function SimulationChart({ runs, trials }) {
        const allYValues = runs.flatMap((run) => run.points.map((point) => point.y));
        const rawMin = Math.min(...allYValues, 0);
        const rawMax = Math.max(...allYValues, 0);
        const range = Math.max(rawMax - rawMin, 1);
        const padding = Math.max(range * 0.15, 1);
        const yMin = Math.min(rawMin - padding, -padding);
        const yMax = Math.max(rawMax + padding, padding);
        const yRange = yMax - yMin;
        const xMin = -2.4;
        const xMax = trials + 1.8;
        const viewBox = `${xMin} ${-yMax} ${xMax - xMin} ${yRange}`;
        const xTicks = buildXTicks(trials);
        const yTicks = buildYTicks(yMin, yMax);
        const fontSize = Math.max(yRange * 0.035, 2.8);
        const strokeWidth = Math.max(yRange * 0.006, 0.55);
        const xAxisLabelY = -yMin - fontSize * 0.8;

        return (
          <div className="overflow-hidden rounded-[28px] border border-slate-200 bg-white p-3 shadow-lg shadow-slate-200/60 sm:p-4">
            <svg
              viewBox={viewBox}
              className="h-[340px] w-full overflow-visible"
              role="img"
              aria-label="5回分の期待値シミュレーション折れ線グラフ"
            >
              <rect
                x={xMin}
                y={-yMax}
                width={xMax - xMin}
                height={yRange}
                rx="1.5"
                fill="url(#chart-bg)"
              />

              <defs>
                <linearGradient id="chart-bg" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stopColor="#ffffff" />
                  <stop offset="100%" stopColor="#eff6ff" />
                </linearGradient>
              </defs>

              {yTicks.map((tick) => (
                <g key={`y-${tick}`}>
                  <line
                    x1="0"
                    y1={-tick}
                    x2={trials}
                    y2={-tick}
                    stroke={tick === 0 ? "#1d4ed8" : "#dbeafe"}
                    strokeWidth={tick === 0 ? strokeWidth * 1.25 : strokeWidth * 0.75}
                    strokeDasharray={tick === 0 ? "none" : `${strokeWidth * 2.4} ${strokeWidth * 2.4}`}
                  />
                  <text
                    x="-0.35"
                    y={-tick}
                    textAnchor="end"
                    dominantBaseline="middle"
                    fill={tick === 0 ? "#1d4ed8" : "#64748b"}
                    fontSize={fontSize}
                    fontWeight={tick === 0 ? "700" : "500"}
                  >
                    {tick}
                  </text>
                </g>
              ))}

              {xTicks.map((tick) => (
                <g key={`x-${tick}`}>
                  <line
                    x1={tick}
                    y1={-yMax + fontSize * 0.2}
                    x2={tick}
                    y2={-yMin}
                    stroke="#e2e8f0"
                    strokeWidth={strokeWidth * 0.65}
                  />
                  <text
                    x={tick}
                    y={xAxisLabelY}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    fill="#64748b"
                    fontSize={fontSize}
                    fontWeight="600"
                  >
                    {tick}
                  </text>
                </g>
              ))}

              <line
                x1="0"
                y1={-yMax}
                x2="0"
                y2={-yMin}
                stroke="#94a3b8"
                strokeWidth={strokeWidth}
              />

              {runs.map((run, index) => (
                <polyline
                  key={run.id}
                  fill="none"
                  stroke={runPalette[index].stroke}
                  strokeWidth={strokeWidth * 1.2}
                  strokeLinejoin="round"
                  strokeLinecap="round"
                  points={run.points.map((point) => `${point.x},${-point.y}`).join(" ")}
                />
              ))}

              {runs.map((run, index) =>
                run.points.map((point, pointIndex) => (
                  <circle
                    key={`${run.id}-${pointIndex}`}
                    cx={point.x}
                    cy={-point.y}
                    r={strokeWidth * 1.15}
                    fill={runPalette[index].stroke}
                    opacity={pointIndex === run.points.length - 1 ? 1 : 0.7}
                  />
                ))
              )}
            </svg>
          </div>
        );
      }

      function SimulatorTab({ params, onChange, onRerun, runs }) {
        const expectedValue = Number(
          (
            (params.successRate / 100) * params.gain -
            ((100 - params.successRate) / 100) * params.loss
          ).toFixed(2)
        );
        const bestRun = Math.max(...runs.map((run) => run.final));
        const worstRun = Math.min(...runs.map((run) => run.final));
        const averageFinal = Number(
          (runs.reduce((sum, run) => sum + run.final, 0) / runs.length).toFixed(2)
        );

        return (
          <div className="space-y-6 fade-up">
            <section className="glass-card tab-surface rounded-[30px] border border-white/70 p-6 shadow-xl shadow-slate-200/60">

                  onChange={(value) => onChange("trials", value)}
                />
              </div>

              <div className="chart-panel rounded-[30px] border border-white/70 p-5 shadow-xl shadow-slate-200/60">
                <div className="grid gap-4 sm:grid-cols-3">
                  <div className="rounded-[22px] bg-white p-4 shadow-sm">
                    <p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                      1回あたり期待値
                    </p>
                    <p className={`mt-3 font-display text-3xl font-semibold ${expectedValue >= 0 ? "text-emerald-600" : "text-rose-600"}`}>
                      {expectedValue}
                    </p>
                  </div>
                  <div className="rounded-[22px] bg-white p-4 shadow-sm">
                    <p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">

                    </p>
                    <p className="mt-3 font-display text-3xl font-semibold text-slate-900">
                      {averageFinal}
                    </p>
                  </div>
                  <div className="rounded-[22px] bg-white p-4 shadow-sm">
                    <p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">

                    </p>
                    <p className="mt-3 text-lg font-bold text-slate-900">
                      {bestRun} / {worstRun}
                    </p>
                  </div>
                </div>

                <div className="mt-5">
                  <SimulationChart runs={runs} trials={params.trials} />
                </div>

                <div className="mt-5 grid gap-3 sm:grid-cols-5">
                  {runs.map((run, index) => (
                    <div
                      key={run.id}
                      className="rounded-[22px] bg-white p-4 shadow-sm"

                      <div className="flex items-center gap-2">
                        <span

      function App() {
        const [activeTab, setActiveTab] = useState("home");
        const [flippedCards, setFlippedCards] = useState({});
        const [quizIndex, setQuizIndex] = useState(0);
        const [quizSelection, setQuizSelection] = useState(null);
        const [quizScore, setQuizScore] = useState(0);
        const [quizComplete, setQuizComplete] = useState(false);
        const [simParams, setSimParams] = useState(initialSimulator);
        const [simulationNonce, setSimulationNonce] = useState(0);
        const [runs, setRuns] = useState(() => generateSimulations(initialSimulator));

        useEffect(() => {
          setRuns(generateSimulations(simParams));
        }, [
          simParams.successRate,
          simParams.gain,
          simParams.loss,
          simParams.trials,
          simulationNonce,
        ]);

        function handleTabSelect(tabId) {
          startTransition(() => {
            setActiveTab(tabId);
          });
        }

        function toggleCard(index) {
          setFlippedCards((current) => ({
            ...current,
            [index]: !current[index],
          }));
        }

        function handleQuizSelect(optionIndex) {
          if (quizSelection !== null || quizComplete) {
            return;
          }

          setQuizSelection(optionIndex);

          if (optionIndex === quizQuestions[quizIndex].answer) {
            setQuizScore((current) => current + 1);
          }
        }

        function handleQuizNext() {
          if (quizIndex === quizQuestions.length - 1) {
            setQuizComplete(true);
            return;
          }

          setQuizIndex((current) => current + 1);
          setQuizSelection(null);
        }

        function resetQuiz() {
          setQuizIndex(0);
          setQuizSelection(null);
          setQuizScore(0);
          setQuizComplete(false);
        }

        function updateSimulatorParam(key, rawValue) {
          const parsed = Number(rawValue);

          if (Number.isNaN(parsed)) {
            return;
          }

          const nextValue =
            key === "successRate"
              ? clamp(parsed, 0, 100)
              : key === "trials"
                ? clamp(Math.round(parsed), 5, 60)
                : clamp(parsed, 1, 20);

          setSimParams((current) => ({
            ...current,
            [key]: nextValue,
          }));
        }

        function rerunSimulation() {
          setSimulationNonce((current) => current + 1);
        }

        function renderActiveTab() {
          switch (activeTab) {
            case "media":
              return <MediaTab />;
            case "cards":
              return <FlashcardsTab flippedCards={flippedCards} onToggle={toggleCard} />;
            case "quiz":
              return (
                <QuizTab
                  quizIndex={quizIndex}
                  selection={quizSelection}
                  score={quizScore}
                  complete={quizComplete}
                  onSelectOption={handleQuizSelect}
                  onNext={handleQuizNext}
                  onReset={resetQuiz}
                />
              );
            case "simulator":
              return (
                <SimulatorTab
                  params={simParams}
                  onChange={updateSimulatorParam}
                  onRerun={rerunSimulation}
                  runs={runs}
                />
              );
            case "home":
            default:
              return <HomeTab />;
          }
        }

        return (
          <div className="min-h-screen">
            <div className="mx-auto flex max-w-[1600px] flex-col gap-6 px-4 py-4 sm:px-6 sm:py-6 lg:flex-row lg:gap-8 lg:px-8">
              <Sidebar activeTab={activeTab} onSelect={handleTabSelect} />

              <main className="min-w-0 flex-1">
                <MobileNav activeTab={activeTab} onSelect={handleTabSelect} />

                <div className="mt-6 lg:mt-0">{renderActiveTab()}</div>

                <footer className="mt-6 rounded-[28px] border border-white/70 bg-white/85 px-6 py-5 shadow-lg shadow-slate-200/60">
                  <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                      <p className="font-display text-xl font-semibold text-slate-900">
                        分析シートのダウンロード
                      </p>
                      <p className="mt-1 text-sm text-slate-500">
                        教材内容を自分の比較軸に落とし込むためのコピー用リンクです。
                      </p>
                    </div>
                    <a
                      href="https://docs.google.com/spreadsheets/u/0/d/1MPHNqta90xhokBEH2-UORkLxbmm7ScD14dWJv9G4F4s/copy"
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center justify-center gap-2 rounded-2xl bg-brand-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-700"
                    >
                      <Icon name="download" className="h-4 w-4 text-white" />
                      Googleスプレッドシートをコピー
                    </a>
                  </div>
                </footer>
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
